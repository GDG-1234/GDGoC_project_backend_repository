[project]
name = "gdg-1234-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cachecontrol>=0.15.0",
    "fastapi[standard]>=0.162.2",
    "google-auth[requests]>=2.62.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.9",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
