name: Deploy

# main에 머지되면 Cloud Run에 자동 배포한다.
# 설정 방법: docs/배포.md
# DATABASE_URL은 Secret Manager에서, FIREBASE_PROJECT_ID는 GitHub 변수에서 넣는다.
# ADMIN_EMAILS 등 나머지 환경변수는 Cloud Run 콘솔에서 설정하면 배포 후에도 유지된다.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # GitHub에 GCP_PROJECT_ID 변수를 등록하기 전에는 배포를 건너뛴다.
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'asia-northeast3' }}
          service: ${{ vars.CLOUD_RUN_SERVICE || 'backend' }}
          source: .
          flags: --allow-unauthenticated
          env_vars: |
            FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
